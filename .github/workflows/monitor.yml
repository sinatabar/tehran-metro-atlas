name: Check enrolled data sources
on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Compare source headers with the reviewed baseline
        run: python3 scripts/monitor_sources.py --baseline data/processed/monitoring/2026-11-24.json > source-observations.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: source-observations
          path: source-observations.json
