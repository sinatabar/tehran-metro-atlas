name: Validate and publish atlas
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /tehran-metro-atlas/
      SITE_ORIGIN: https://sinatabar.github.io
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/osm-requirements.txt
      - run: python scripts/build.py --check
      - run: python -m unittest discover -s tests/data
      - run: python scripts/osm_verify.py data/raw/osm/2026-11-23 data/reviewed/osm
      - run: python scripts/check_gis.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist/
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
      - name: Verify live public routes and dataset checksums
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/web-verify-deployment.mjs "$PUBLIC_URL"
